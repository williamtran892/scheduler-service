<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheduler Appointments API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one slim product bar, then Redoc's three-column reference fills the page.
     Single light theme by choice: Redoc renders a light reference, so the page commits to it. */
  :root {
    color-scheme: light;
    --ink: #1b2a28;         /* text, teal-biased near-black */
    --ink-muted: #5b6b68;   /* secondary text */
    --paper: #ffffff;       /* main panel */
    --rail: #15262a;        /* right-hand code panel */
    --accent: #0b6e4f;      /* workshop green: links, active nav, method chips */
    --accent-soft: #e3f1ec; /* chip fill */
    --line: #d9e2e0;
    --font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --bar-h: 56px;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    height: var(--bar-h); box-sizing: border-box;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-inline: 20px; background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
  .bar .meta { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .chip {
    font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums;
    padding: 3px 8px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .chip.quiet { background: transparent; color: var(--ink-muted); border: 1px solid var(--line); }
  .model { font-size: 12.5px; color: var(--ink-muted); }
  @media (max-width: 640px) { .model { display: none; } .bar { gap: 10px; } }
  #redoc { min-height: 60vh; }
  .fallback { padding: 24px 20px; max-width: 65ch; color: var(--ink-muted); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header class="bar">
  <h1>Scheduler Appointments API</h1>
  <span class="model">Book, read, move and close appointments · subset of the full contract</span>
  <span class="meta"><span class="chip">v1.0.0-draft</span><span class="chip quiet">OpenAPI 3.1</span></span>
</header>
<div id="redoc"><p class="fallback">Loading the API reference…</p></div>
<script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js"></script>
<script>
  Redoc.init('./openapi.yaml', {
    scrollYOffset: 56,
    hideDownloadButton: true,
    expandResponses: "200,201",
    pathInMiddlePanel: true,
    requiredPropsFirst: true,
    sortPropsAlphabetically: false,
    jsonSampleExpandLevel: 3,
    theme: {
      spacing: { sectionVertical: 28 },
      typography: {
        fontSize: "14.5px", lineHeight: "1.55",
        fontFamily: '"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif',
        headings: { fontFamily: '"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif', fontWeight: "600" },
        code: { fontFamily: '"IBM Plex Mono", Menlo, Consolas, monospace', fontSize: "13px", color: "#0b6e4f", backgroundColor: "#eef4f2" },
        links: { color: "#0b6e4f", visited: "#0b6e4f", hover: "#085a40" }
      },
      colors: {
        primary: { main: "#0b6e4f" },
        text: { primary: "#1b2a28", secondary: "#5b6b68" },
        border: { dark: "#c9d5d2", light: "#d9e2e0" },
        http: { get: "#0b6e4f", post: "#1f5fa8", put: "#8a5a00", patch: "#8a5a00", delete: "#a8322d" },
        responses: { success: { color: "#0b6e4f", backgroundColor: "#e3f1ec" }, error: { color: "#a8322d", backgroundColor: "#f8e8e7" } }
      },
      sidebar: { backgroundColor: "#f4f7f6", textColor: "#1b2a28", activeTextColor: "#0b6e4f", width: "272px" },
      rightPanel: { backgroundColor: "#15262a", textColor: "#e8efed", width: "40%" },
      codeBlock: { backgroundColor: "#0f1c1f" }
    }
  }, document.getElementById('redoc'));
</script>
</body>
</html>
