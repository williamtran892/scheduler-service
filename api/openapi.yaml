openapi: 3.1.0
info:
  title: Scheduler Appointments API
  version: 1.0.0-draft
  summary: Booking and lifecycle operations of the Unified Service Scheduler, extracted from the full contract.
  description: >-
    Subset of the full contract (`api/openapi.yaml`) limited to the **Appointments** and **Lifecycle** tags.

    Generated by `api/subset.js`; do not edit by hand.


    ## The model in one paragraph

    Capacity is a **ledger of cells**: every bay and every technician has one row per grid cell (15 minutes by
    default)

    for every cell inside opening hours. An appointment **claims a run of consecutive cells** on one bay and
    one

    technician, including buffers. The appointment keeps exact minutes; only the ledger is quantised.


    ## Guarantees

    * **No false confirmation.** A `201` from `POST /appointments` means the cells are committed. Two
    concurrent
      requests can never both hold the same bay or technician for overlapping time.
    * **Safe to repeat, no header needed.** The natural booking key `(vehicle, customer, start, kind)` is a
    unique
      index on the appointment. Retrying or double-submitting the same booking returns the one appointment that
      exists; the same key with a different service type is `409 DUPLICATE_BOOKING`. The appointment `id` is
      generated by the server and is also the reference quoted to the customer.
    * **Server-side allocation.** Clients never choose a bay or technician when booking. Staff can move a job
      afterwards with `reschedule`, which also covers reassign.
    * **Explicit errors.** Every failure is an RFC 9457 problem with a stable `code`.

    ## Lifecycle

    `CONFIRMED` → `CHECKED_IN` | `CANCELLED` | `NO_SHOW`; `NO_SHOW` → `CHECKED_IN` (late arrival);

    `CHECKED_IN` → `IN_PROGRESS` | `CANCELLED`; `IN_PROGRESS` → `COMPLETED`. Reschedule keeps `CONFIRMED`.

    Each transition takes `expectedVersion`; a stale version is `409 VERSION_CONFLICT`.


    ## Conventions

    All instants are ISO 8601 with offset; the server stores UTC. Enumerated values are defined in the
    application;

    unknown values are `422 INVALID_VALUE`. Nothing is hard-deleted: appointments are cancelled, never
    removed.


    Availability search, schedule, admin and operations endpoints are in the full contract.
  contact:
    name: Scheduler team
servers:
  - url: http://localhost:8080/v1
    description: Local development (`scheduler serve`)
  - url: https://scheduler.example.com/v1
    description: Placeholder for the deployed environment
security:
  - bearerAuth: []
tags:
  - name: Appointments
    description: Book, read and move appointments. The write path of requirement R2 and the record of R3.
  - name: Lifecycle
    description: Day-of transitions. Each one releases or keeps ledger cells as described per operation.
paths:
  /appointments:
    post:
      tags:
        - Appointments
      operationId: bookAppointment
      summary: Book an appointment in one transaction
      description: >
        Resolves the service type into a requirement, computes the qualified `(bay, technician)` pairs

        that are free at `startAt`, and tries them least-loaded first. For each pair, one transaction:

        insert the appointment with a service-generated id (which is also the customer-facing reference), lock
        the bay run and the technician run

        (`SELECT ... FOR UPDATE`), verify every cell exists and is free, mark them `BOOKED`, append the

        audit event and the outbox event, commit.


        **Safe to repeat.** The booking key `(vehicleId, customerId, startAt, kind)` is a unique index on

        the appointment and the insert is the first statement of the transaction. A retry or a double

        submit with the same key and the same request returns the existing appointment with `201`; a

        concurrent duplicate blocks on the index until the first attempt finishes, so two appointments

        for one key are impossible. The same key with a different service type or dealership is

        `409 DUPLICATE_BOOKING`, carrying the existing appointment. A retry of a request that failed

        (for example `409 SLOT_TAKEN`) simply runs again. Note that a cancelled appointment still owns

        its key, so rebooking the same vehicle for the same minute after a cancel is also

        `409 DUPLICATE_BOOKING`; pick an adjacent start or reschedule the original.


        **Outcomes.** `201` with the record, or `409 SLOT_TAKEN` when every candidate

        pair was taken between search and confirm, or `409 AVAILABILITY_CHANGED` when the cells no

        longer exist (opening hours changed, resource retired, skill end-dated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
            examples:
              dropOff:
                summary: Advisor books an EV major service as a drop-off with a courtesy car
                value:
                  dealershipId: 7c1e2b1a-0d7d-4c2e-9a1f-1b2c3d4e5f60
                  serviceTypeId: 3f9d7f2c-6a1b-4b3e-8c2d-9e8f7a6b5c40
                  customerId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c80
                  vehicleId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c50
                  startAt: '2026-10-20T09:00:00+01:00'
                  kind: DROP_OFF
                  customerRequests:
                    waiting: false
                    courtesyCar: true
                    notes: Charging port cover loose
                  notes: Customer prefers a morning call when ready.
      responses:
        '201':
          description: Confirmed. Also returned, unchanged, when the same booking is submitted again.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL of the appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                confirmed:
                  $ref: '#/components/examples/AppointmentConfirmed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The requested time cannot be confirmed right now.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                slotTaken:
                  summary: Every candidate pair was claimed by someone else between search and confirm
                  value:
                    type: https://scheduler.example.com/problems/SLOT_TAKEN
                    title: Slot taken
                    status: 409
                    code: SLOT_TAKEN
                    detail: No compatible bay and qualified technician are both free at 2026-10-20T09:00:00+01:00.
                availabilityChanged:
                  summary: Cells disappeared between search and confirm
                  value:
                    type: https://scheduler.example.com/problems/AVAILABILITY_CHANGED
                    title: Availability changed
                    status: 409
                    code: AVAILABILITY_CHANGED
                    detail: The capacity shown is no longer current.
                duplicateBooking:
                  summary: >-
                    The same vehicle, customer, start and kind already have an appointment with a different
                    service type
                  value:
                    type: https://scheduler.example.com/problems/DUPLICATE_BOOKING
                    title: Duplicate booking
                    status: 409
                    code: DUPLICATE_BOOKING
                    detail: >-
                      YK21 ABC is already booked at 2026-10-20T09:00:00+01:00 (appointment
                      8f1c3b7a-5d2e-4c1f-9a6b-2e7d1c4f8a90, INTERIM). Reschedule it or choose another start.
                    existing:
                      id: 8f1c3b7a-5d2e-4c1f-9a6b-2e7d1c4f8a90
                      status: CONFIRMED
                      startAt: '2026-10-20T09:00:00+01:00'
                      endAt: '2026-10-20T10:00:00+01:00'
                      serviceTypeCode: INTERIM
        '422':
          description: The request cannot be booked as stated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                offGrid:
                  value:
                    type: https://scheduler.example.com/problems/OFF_GRID_START
                    title: Start not on the booking grid
                    status: 422
                    code: OFF_GRID_START
                    detail: MAN01 books on a 15 minute grid; 09:05 is not a valid start.
                outsideHours:
                  value:
                    type: https://scheduler.example.com/problems/OUTSIDE_OPENING_HOURS
                    title: Outside opening hours
                    status: 422
                    code: OUTSIDE_OPENING_HOURS
                    detail: MAN01 is closed on 2026-10-25 (Sunday).
                noQualifiedTechnician:
                  value:
                    type: https://scheduler.example.com/problems/NO_QUALIFIED_TECHNICIAN
                    title: No qualified technician
                    status: 422
                    code: NO_QUALIFIED_TECHNICIAN
                    detail: No active technician at MAN01 holds skill EV_HV_L3 on 2026-10-20.
    get:
      tags:
        - Appointments
      operationId: listAppointments
      summary: List appointments
      description: |
        Customers see only their own. Staff must give `dealershipId`. Results are ordered by `startAt`.
      parameters:
        - name: dealershipId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: customerId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: vehicleId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AppointmentStatus'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: A page of appointment summaries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentSummary'
                  nextCursor:
                    type:
                      - string
                      - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /appointments/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      tags:
        - Appointments
      operationId: getAppointment
      summary: Full appointment record
      description: The R3 record, with the ledger cells it owns and, on request, its audit trail.
      parameters:
        - name: include
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - events
          description: Add `events` to receive the append-only audit trail.
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                confirmed:
                  $ref: '#/components/examples/AppointmentConfirmed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /appointments/{appointmentId}/reschedule:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      tags:
        - Appointments
      operationId: rescheduleAppointment
      summary: Move an appointment, or reassign its bay or technician
      description: |
        One transaction: claim the new runs with this appointment's own cells counting as claimable,
        release every cell outside the new runs, update the record with an optimistic version check.
        If the claim fails nothing changes and the customer keeps the original booking.

        * Give `startAt` to move in time; the server picks the pair unless you also pin one.
        * Give `technicianId` and/or `serviceBayId` with the same `startAt` (or none) to **reassign**.
          The server re-validates skills, bay type and overlap on every move.
        * Allowed from `CONFIRMED`. A `NO_SHOW` late arrival is handled by `check-in`, not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
            examples:
              move:
                summary: Move 30 minutes later, server chooses resources
                value:
                  startAt: '2026-10-20T09:30:00+01:00'
                  expectedVersion: 1
                  reason: Customer running late
              reassign:
                summary: Controller moves the job to another technician, same time
                value:
                  technicianId: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b60
                  expectedVersion: 2
      responses:
        '200':
          description: The updated appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The move could not be made. The original booking is unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                slotTaken:
                  value:
                    type: https://scheduler.example.com/problems/SLOT_TAKEN
                    title: Slot taken
                    status: 409
                    code: SLOT_TAKEN
                    detail: The requested cells are no longer free. The appointment keeps its original time.
                versionConflict:
                  value:
                    type: https://scheduler.example.com/problems/VERSION_CONFLICT
                    title: Version conflict
                    status: 409
                    code: VERSION_CONFLICT
                    detail: Appointment is at version 3; you sent 2. Fetch it and retry.
                invalidTransition:
                  value:
                    type: https://scheduler.example.com/problems/INVALID_TRANSITION
                    title: Invalid transition
                    status: 409
                    code: INVALID_TRANSITION
                    detail: A COMPLETED appointment cannot be rescheduled.
        '422':
          description: The target is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unqualified:
                  value:
                    type: https://scheduler.example.com/problems/NO_QUALIFIED_TECHNICIAN
                    title: No qualified technician
                    status: 422
                    code: NO_QUALIFIED_TECHNICIAN
                    detail: Technician Lee K. does not hold EV_HV_L3 on 2026-10-20.
  /appointments/{appointmentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      tags:
        - Lifecycle
      operationId: cancelAppointment
      summary: Cancel
      description: |
        `CONFIRMED` or `CHECKED_IN` → `CANCELLED`. Every cell the appointment owns returns to `FREE`
        immediately and is visible to other searches. Cancelling an already cancelled appointment
        returns the record unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            examples:
              cancel:
                value:
                  expectedVersion: 1
                  reason: Customer no longer needs the service
      responses:
        '200':
          $ref: '#/components/responses/AppointmentOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionConflict'
  /appointments/{appointmentId}/check-in:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      tags:
        - Lifecycle
      operationId: checkInAppointment
      summary: Check the customer in on the day
      description: |
        `CONFIRMED` → `CHECKED_IN`. Staff only. Emits `AppointmentCheckedIn`, which the DMS adapter
        turns into a repair order.

        **Late arrival.** From `NO_SHOW` the server re-claims cells for the job starting at the current
        grid cell on any qualified pair that is free, in the same transaction as the check-in. If
        nothing is free the response is `409 SLOT_TAKEN` and the advisor books a fresh appointment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
            examples:
              checkIn:
                value:
                  expectedVersion: 1
                  mileage: 41230
                  additionalConcerns: Intermittent warning light on cold start
      responses:
        '200':
          $ref: '#/components/responses/AppointmentOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionConflict'
  /appointments/{appointmentId}/start:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      tags:
        - Lifecycle
      operationId: startAppointment
      summary: Technician starts work
      description: '`CHECKED_IN` → `IN_PROGRESS`. Records `actualStartAt` (defaults to now). No ledger change.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionConflict'
  /appointments/{appointmentId}/complete:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      tags:
        - Lifecycle
      operationId: completeAppointment
      summary: Technician completes work
      description: |
        `IN_PROGRESS` → `COMPLETED`. Records `actualEndAt` (defaults to now). Cells that start at or
        after the current grid cell (rounded up) return to `FREE`, so an early finish is bookable by a
        walk-in; cells already in the past stay `BOOKED` for the record. Utilisation reporting uses
        the actual times on the appointment, not the ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionConflict'
  /appointments/{appointmentId}/no-show:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      tags:
        - Lifecycle
      operationId: markNoShow
      summary: Mark a no-show
      description: |
        `CONFIRMED` → `NO_SHOW`. Every cell returns to `FREE`. Normally applied by the sweeper job once
        `startAt` plus the grace period (default 30 minutes) has passed; staff may apply it by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          $ref: '#/components/responses/AppointmentOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth2/OIDC access token issued by the gateway. Claims: `tenant_id`, `roles` (one or more of
        `customer`, `advisor`, `controller`, `admin`, `integration`), `dealership_ids` for staff,
        `customer_id` for customers, and `channel` (`CUSTOMER_WEB`, `CUSTOMER_APP`, `ADVISOR_CONSOLE`,
        `CALL_CENTRE`, `INTEGRATION`), which is recorded on every appointment and event.
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    AppointmentOk:
      description: The appointment after the transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Appointment'
    TransitionConflict:
      description: >-
        The transition is not allowed from the current state, or the version is stale, or (late arrival) no
        cells are free.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidTransition:
              value:
                type: https://scheduler.example.com/problems/INVALID_TRANSITION
                title: Invalid transition
                status: 409
                code: INVALID_TRANSITION
                detail: Cannot start an appointment that is CONFIRMED; check it in first.
            versionConflict:
              value:
                type: https://scheduler.example.com/problems/VERSION_CONFLICT
                title: Version conflict
                status: 409
                code: VERSION_CONFLICT
                detail: Appointment is at version 2; you sent 1.
    BadRequest:
      description: Malformed request (unparseable body, missing required field, bad date format).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: https://scheduler.example.com/problems/VALIDATION_ERROR
                title: Validation error
                status: 400
                code: VALIDATION_ERROR
                detail: startAt must be an ISO 8601 date-time with offset.
                errors:
                  - field: startAt
                    message: must be an ISO 8601 date-time with offset
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The token's role or scope does not allow this, or the resource belongs to another tenant, dealership
        or customer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in the caller's tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
      examples:
        - 8f1c3b7a-5d2e-4c1f-9a6b-2e7d1c4f8a90
    BayType:
      type: string
      enum:
        - GENERAL
        - MOT
        - EV_HV
        - ALIGNMENT
        - BODYSHOP
        - EXPRESS
      description: What a bay is equipped for. A service type lists the bay types that can host it.
    AppointmentKind:
      type: string
      enum:
        - WAITER
        - DROP_OFF
        - LOANER
      description: Recorded in v1; waiter-versus-drop-off rules are a phase 2 policy.
    AppointmentStatus:
      type: string
      enum:
        - CONFIRMED
        - CHECKED_IN
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - NO_SHOW
      description: >
        Transitions: `CONFIRMED` → `CHECKED_IN` | `CANCELLED` | `NO_SHOW`; `NO_SHOW` → `CHECKED_IN` (late
        arrival);

        `CHECKED_IN` → `IN_PROGRESS` | `CANCELLED`; `IN_PROGRESS` → `COMPLETED`. Reschedule keeps `CONFIRMED`.
    Channel:
      type: string
      enum:
        - CUSTOMER_WEB
        - CUSTOMER_APP
        - ADVISOR_CONSOLE
        - CALL_CENTRE
        - INTEGRATION
    ProblemCode:
      type: string
      enum:
        - SLOT_TAKEN
        - AVAILABILITY_CHANGED
        - VERSION_CONFLICT
        - INVALID_TRANSITION
        - DUPLICATE
        - NO_QUALIFIED_TECHNICIAN
        - OUTSIDE_OPENING_HOURS
        - OFF_GRID_START
        - SERVICE_NOT_BOOKABLE_ONLINE
        - DUPLICATE_BOOKING
        - INVALID_VALUE
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
      description: >
        | Code | Status | Meaning |

        |---|---|---|

        | `SLOT_TAKEN` | 409 | Every candidate pair was claimed between search and confirm |

        | `AVAILABILITY_CHANGED` | 409 | Cells disappeared (hours changed, resource retired, skill end-dated) |

        | `VERSION_CONFLICT` | 409 | `expectedVersion` is stale |

        | `INVALID_TRANSITION` | 409 | Not allowed from the current status |

        | `DUPLICATE` | 409 | Unique key already exists |

        | `NO_QUALIFIED_TECHNICIAN` | 422 | No technician at the site holds the required skills on the date |

        | `OUTSIDE_OPENING_HOURS` | 422 | Requested window is outside dealership hours |

        | `OFF_GRID_START` | 422 | Start (or opening time) is not on the dealership grid |

        | `SERVICE_NOT_BOOKABLE_ONLINE` | 422 | Customer channel asked for a staff-only service |

        | `DUPLICATE_BOOKING` | 409 | The booking key `(vehicle, customer, start, kind)` already has an
        appointment and the rest of the request differs. `existing` included |

        | `INVALID_VALUE` | 422 | Enumeration or range violated |

        | `VALIDATION_ERROR` | 400 | Malformed request |
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is the stable machine-readable discriminator.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
        instance:
          type: string
          format: uri
        existing:
          type: object
          description: Present on `DUPLICATE_BOOKING`. The appointment that already owns the booking key.
          required:
            - id
            - status
            - startAt
            - endAt
            - serviceTypeCode
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/AppointmentStatus'
            startAt:
              type: string
              format: date-time
            endAt:
              type: string
              format: date-time
            serviceTypeCode:
              type: string
        errors:
          type: array
          description: Present on `VALIDATION_ERROR` and `INVALID_VALUE`.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    CustomerRequests:
      type: object
      properties:
        waiting:
          type: boolean
          description: Customer intends to wait on site.
        courtesyCar:
          type: boolean
        collectionAndDelivery:
          type: boolean
        notes:
          type: string
          maxLength: 2000
          description: Free text from the customer ("rattle from rear left").
    BookAppointmentRequest:
      type: object
      description: >-
        `vehicleId`, `customerId`, `startAt` and `kind` together form the booking key that makes a repeat of
        this request safe.
      required:
        - dealershipId
        - serviceTypeId
        - customerId
        - vehicleId
        - startAt
        - kind
      properties:
        dealershipId:
          $ref: '#/components/schemas/Uuid'
        serviceTypeId:
          $ref: '#/components/schemas/Uuid'
        customerId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Customers may only book for themselves; the server checks the token.
        vehicleId:
          $ref: '#/components/schemas/Uuid'
        startAt:
          type: string
          format: date-time
          description: Desired arrival / work start. Must be on the dealership grid and inside the booking horizon.
        kind:
          $ref: '#/components/schemas/AppointmentKind'
        customerRequests:
          $ref: '#/components/schemas/CustomerRequests'
        notes:
          type: string
          maxLength: 4000
          description: Internal notes. Staff channels only; ignored for customer channels.
    RescheduleRequest:
      type: object
      required:
        - expectedVersion
      minProperties: 2
      properties:
        startAt:
          type: string
          format: date-time
          description: New customer-facing start. Omit to keep the current time (pure reassign).
        technicianId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Pin the technician. Staff only. Must be qualified for the service type on the date.
        serviceBayId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Pin the bay. Staff only. Must be an allowed type and active.
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
    TransitionRequest:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
    CheckInRequest:
      allOf:
        - $ref: '#/components/schemas/TransitionRequest'
        - type: object
          properties:
            mileage:
              type: integer
              minimum: 0
            additionalConcerns:
              type: string
              maxLength: 4000
    StartRequest:
      allOf:
        - $ref: '#/components/schemas/TransitionRequest'
        - type: object
          properties:
            startedAt:
              type: string
              format: date-time
              description: Defaults to now. Allows clocking data from the DMS to be back-filled.
    CompleteRequest:
      allOf:
        - $ref: '#/components/schemas/TransitionRequest'
        - type: object
          properties:
            completedAt:
              type: string
              format: date-time
              description: Defaults to now.
    CellRange:
      type: object
      description: The ledger cells this appointment owns on one resource, as a half-open interval on the grid.
      required:
        - from
        - to
        - cells
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        cells:
          type: integer
    AppointmentEvent:
      type: object
      required:
        - id
        - type
        - actor
        - occurredAt
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          examples:
            - CONFIRMED
            - RESCHEDULED
            - CHECKED_IN
            - STARTED
            - COMPLETED
            - CANCELLED
            - NO_SHOW
        actor:
          type: string
          description: User id, client id or job name.
        channel:
          $ref: '#/components/schemas/Channel'
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: Transition-specific detail (previous and new times for a reschedule, reason for a cancel).
    AppointmentSummary:
      type: object
      required:
        - id
        - status
        - kind
        - startAt
        - endAt
        - dealershipId
        - customer
        - vehicle
        - serviceType
        - serviceBay
        - technician
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: >-
            Generated by the server. Doubles as the reference quoted to the customer; there is no separate
            reference number.
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        kind:
          $ref: '#/components/schemas/AppointmentKind'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        dealershipId:
          $ref: '#/components/schemas/Uuid'
        customer:
          type: object
          required:
            - id
            - displayName
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            displayName:
              type: string
        vehicle:
          type: object
          required:
            - id
            - registration
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            registration:
              type: string
            make:
              type: string
            model:
              type: string
        serviceType:
          type: object
          required:
            - id
            - code
            - name
            - durationMinutes
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            code:
              type: string
            name:
              type: string
            durationMinutes:
              type: integer
        serviceBay:
          type: object
          required:
            - id
            - name
            - type
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            type:
              $ref: '#/components/schemas/BayType'
        technician:
          type: object
          description: >-
            Customer channels receive `id` only unless the dealership chooses to show names (open question 1
            in the design).
          required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            displayName:
              type: string
    Appointment:
      allOf:
        - $ref: '#/components/schemas/AppointmentSummary'
        - type: object
          required:
            - dealership
            - channel
            - version
            - createdAt
            - updatedAt
            - cells
          properties:
            dealership:
              type: object
              required:
                - id
                - code
                - name
                - timezone
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                code:
                  type: string
                name:
                  type: string
                timezone:
                  type: string
            cells:
              type: object
              description: Ledger cells owned, including buffers. Staff channels only; omitted for customers.
              properties:
                bay:
                  $ref: '#/components/schemas/CellRange'
                technician:
                  $ref: '#/components/schemas/CellRange'
            customerRequests:
              $ref: '#/components/schemas/CustomerRequests'
            notes:
              type: string
              description: Staff channels only.
            channel:
              $ref: '#/components/schemas/Channel'
            actualStartAt:
              type:
                - string
                - 'null'
              format: date-time
            actualEndAt:
              type:
                - string
                - 'null'
              format: date-time
            version:
              type: integer
              description: Send back as `expectedVersion` on any change.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            events:
              type: array
              description: Present when `include=events`.
              items:
                $ref: '#/components/schemas/AppointmentEvent'
